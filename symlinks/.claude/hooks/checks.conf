# Which checks to run, and the cheap test for whether they are worth starting.
#
#   <glob><TAB><script relative to this directory>
#
# The glob is matched against the whole hook payload. Keep it loose: the check
# itself decides for real, this only avoids starting an interpreter for nothing.
# Too broad costs a few milliseconds. Too narrow silently skips the check.

*gh pr*	checks/mr-description-style.py
*glab mr*	checks/mr-description-style.py
